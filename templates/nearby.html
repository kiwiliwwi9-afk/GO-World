<!DOCTYPE html>
<html>
<head>
    <title>Люди рядом — GO World</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding-bottom: 70px; }
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 12px 16px;
            border-top: 1px solid #e0e0e0;
        }
        .nav-item { text-align: center; text-decoration: none; color: #8e8e8e; font-size: 12px; }
        .nav-icon { font-size: 24px; }
        .container { max-width: 600px; margin: 0 auto; padding: 16px; }
        .header { margin-bottom: 20px; }
        .logo { font-size: 28px; font-weight: bold; background: linear-gradient(135deg, #8a2be2, #00d2ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .map-placeholder {
            background: #e0e0e0;
            height: 300px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%238a2be2" width="48px" height="48px"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 48px;
        }
        .nearby-user {
            display: flex;
            align-items: center;
            gap: 12px;
            background: white;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 8px;
        }
        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8a2be2, #00d2ff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .nearby-info { flex: 1; }
        .nearby-name { font-weight: 600; }
        .nearby-distance { font-size: 12px; color: #8e8e8e; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">Люди рядом</div>
        </div>

        <div class="map-placeholder">
            <!-- Здесь будет карта -->
        </div>

        <div class="nearby-user">
            <div class="avatar">A</div>
            <div class="nearby-info">
                <div class="nearby-name">alex_traveler</div>
                <div class="nearby-distance">📍 1.2 км от вас</div>
            </div>
        </div>
        <div class="nearby-user">
            <div class="avatar">M</div>
            <div class="nearby-info">
                <div class="nearby-name">maria_travel</div>
                <div class="nearby-distance">📍 2.5 км от вас</div>
            </div>
        </div>
        <div class="nearby-user">
            <div class="avatar">D</div>
            <div class="nearby-info">
                <div class="nearby-name">diana_photo</div>
                <div class="nearby-distance">📍 3.8 км от вас</div>
            </div>
        </div>
    </div>

    <div class="navbar">
        <a href="/feed" class="nav-item"><div class="nav-icon">🏠</div><span>Главная</span></a>
        <a href="/search" class="nav-item"><div class="nav-icon">🔍</div><span>Поиск</span></a>
        <a href="/messages" class="nav-item"><div class="nav-icon">💬</div><span>Сообщения</span></a>
        <a href="/notifications" class="nav-item"><div class="nav-icon">🔔</div><span>Уведомления</span></a>
        <a href="/profile/{{ current_user.username }}" class="nav-item"><div class="nav-icon">👤</div><span>Профиль</span></a>
    </div>
</body>
</html>
