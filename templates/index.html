<!DOCTYPE html>
<html>
<head>
    <title>GO World — Твой мир. Твои правила.</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .logo {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 48px;
            color: white;
            margin-bottom: 20px;
        }
        .tagline {
            font-size: 20px;
            color: rgba(255,255,255,0.9);
            margin-bottom: 50px;
        }
        .btn {
            background: white;
            color: #667eea;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
            transition: transform 0.3s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid white;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🌍</div>
        <h1>GO WORLD</h1>
        <p class="tagline">Твой мир. Твои правила.</p>
        <div>
            <a href="/login" class="btn">Войти</a>
            <a href="/register" class="btn btn-outline">Регистрация</a>
        </div>
    </div>
</body>
</html>
