<!DOCTYPE html>
<html>
<head>
    <title>Редактировать профиль — GO World</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; border-radius: 30px; padding: 30px; }
        h1 { margin-bottom: 20px; }
        textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 15px;
            font-size: 16px;
            resize: vertical;
            margin-bottom: 20px;
        }
        .btn {
            background: #8a2be2;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
        }
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #8a2be2;
            text-decoration: none;
        }
        .alert {
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .alert-success { background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Редактировать профиль</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <textarea name="bio" rows="4" placeholder="О себе">{{ current_user.bio or '' }}</textarea>
            <button type="submit" class="btn">Сохранить</button>
        </form>

        <a href="/profile/{{ current_user.username }}" class="back-link">← Назад в профиль</a>
    </div>
</body>
</html>
